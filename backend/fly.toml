# fly.toml app configuration file generated for vibematch-backend on 2026-08-31T23:33:21+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vibematch-backend'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
